version: '3.8'

services:
  db:
    image: postgres:16
    container_name: vertex_postgres
    environment:
      POSTGRES_USER: vertex_user
      POSTGRES_PASSWORD: vertex_pass
      POSTGRES_DB: vertex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: