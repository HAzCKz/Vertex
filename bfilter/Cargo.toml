[package]
name = "bfilter"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
bitvec = "1.0"
rand = "0.9.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
flate2 = "1.0"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
